name: Generar imágenes

# Cada vez que cambias el contenido, las plantillas o la marca, se rehacen las imágenes.
on:
  push:
    branches: [main]
    paths: ["contenido/**", "plantillas/**", "marca/**", "config.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - run: python scripts/generar_imagenes.py
      - run: python scripts/hoja_manual.py
      - name: Guardar imágenes
        run: |
          git config user.name "softtident-bot"
          git config user.email "bot@users.noreply.github.com"
          git add imagenes PUBLICAR-A-MANO.md
          git diff --cached --quiet || git commit -m "Imágenes y hoja manual actualizadas"
          git push
