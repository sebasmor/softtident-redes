{% extends "base.html" %}
{# Preguntas frecuentes: hasta 5 preguntas con su respuesta corta. #}
{% block contenido %}
<div class="lienzo">
  <img class="marca" src="{{ marca }}/marca-color.png" alt="">
  <h1 style="margin-top: 64px; font-size: 72px; line-height: 1.1;">{{ titulo | safe }}</h1>
  <div class="lista" style="margin-top: 48px;">
    {% for q in preguntas %}
    <div class="fila" style="flex-direction: column; align-items: flex-start; gap: 6px; padding: 18px 0;">
      <div style="font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 30px; color: #046C80;">{{ q.p }}</div>
      <div style="font-size: 28px; line-height: 1.4;">{{ q.r }}</div>
    </div>
    {% endfor %}
  </div>
  <div class="pie" style="padding-top: 32px;">
    <div class="chico">¿Otra pregunta? Escríbenos</div>
    <div class="numero" style="font-size: 56px;">{{ config.whatsapp }}</div>
  </div>
</div>
{% endblock %}
